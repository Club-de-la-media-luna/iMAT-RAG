[project]
name = "imat-rag"
version = "0.1.0"
description = "Retrieval over the MIA master's reading list"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pymupdf>=1.24",
    "typer>=0.12",
]

[project.optional-dependencies]
# Stage dependencies are extras so that a group member who only queries the
# index never installs the extraction and embedding stacks.
# Dense embeddings only: LanceDB supplies the lexical half with BM25,
# so BGE-M3's sparse output is unused and sentence-transformers suffices.
index = ["lancedb>=0.13", "sentence-transformers>=3.0", "tantivy>=0.22"]

[project.scripts]
rag = "imat_rag.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "pylint>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imat_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
# Matches .python-version. Targeting 3.11 made mypy reject numpy's own stubs,
# which use `type` statement syntax that only parses under 3.12+.
python_version = "3.12"
packages = ["imat_rag"]
mypy_path = "src"
strict = true

[tool.pylint.main]
source-roots = ["src"]

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    # Fires on pydantic models that share field names. A stored Chunk and a
    # returned Hit are different types that legitimately declare the same
    # citation fields; collapsing them would couple storage to the API.
    "duplicate-code",
]
