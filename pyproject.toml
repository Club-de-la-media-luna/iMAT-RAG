[project]
name = "imat-rag"
version = "0.1.0"
description = "Retrieval over the MIA master's reading list"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.optional-dependencies]
# Stage dependencies are extras so that a group member who only queries the
# index never installs the extraction and embedding stacks.
extract = ["pymupdf>=1.24"]
index = ["lancedb>=0.13", "FlagEmbedding>=1.3"]

[project.scripts]
rag = "imat_rag.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "pylint>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imat_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
packages = ["imat_rag"]
mypy_path = "src"
strict = true

[tool.pylint.main]
source-roots = ["src"]

[tool.pylint."messages control"]
disable = ["missing-module-docstring"]
